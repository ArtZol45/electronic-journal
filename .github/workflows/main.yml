name: Java CI

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Code style, tests and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check Conventional Commit message
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            MESSAGE="$PR_TITLE"
          else
            MESSAGE="$(git log -1 --pretty=%s)"
          fi

          echo "Checking: $MESSAGE"

          if ! printf '%s\n' "$MESSAGE" |
            grep -Eq '^(feat|fix|docs|style|refactor|test|chore|ci|build|perf|revert)(\([a-zA-Z0-9._/-]+\))?!?: .{1,100}$'; then
            echo "Invalid Conventional Commit message"
            exit 1
          fi

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: change dir
        run: cd electronic-journal
        
      - name: Make Maven Wrapper executable
        run: chmod +x ./mvnw

      - name: Check style, run tests and build
        run: ./mvnw --batch-mode clean verify

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/
          if-no-files-found: warn

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: target/surefire-reports/
          if-no-files-found: warn

      - name: Upload application JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: electronic-journal-jar
          path: target/*.jar
